name: SignificantHobbies
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PersonalSyncKit:
    url: https://github.com/Significant-Hobbies/personal-platform.git
    revision: 55176cac008d3857ef815d9bc5c8e74b68e7c3f3
targets:
  SignificantHobbiesCore:
    type: framework
    platform: iOS
    sources: Sources/SignificantHobbiesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.app.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  SignificantHobbies:
    type: application
    platform: iOS
    sources:
      - path: Sources/SignificantHobbies
      - path: Sources/SignificantHobbies/Resources
        buildPhase: resources
    dependencies:
      - target: SignificantHobbiesCore
      - package: PersonalSyncKit
    info:
      path: Sources/SignificantHobbies/Info.plist
      properties:
        CFBundleDisplayName: Journal by Significant Hobbies
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.significanthobbies.app.auth
            CFBundleURLSchemes:
              - significanthobbies
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.app
        PRODUCT_NAME: Journal by Significant Hobbies
        CODE_SIGN_ENTITLEMENTS: Sources/SignificantHobbies/SignificantHobbies.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  SignificantHobbiesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/SignificantHobbiesCoreTests
    dependencies:
      - target: SignificantHobbiesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.app.core-tests
        GENERATE_INFOPLIST_FILE: YES
  SignificantHobbiesTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/SignificantHobbiesTests
    dependencies:
      - target: SignificantHobbies
      - package: PersonalSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Journal by Significant Hobbies.app/Journal by Significant Hobbies"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SignificantHobbiesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/SignificantHobbiesUITests
    dependencies:
      - target: SignificantHobbies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SignificantHobbies:
    build:
      targets:
        SignificantHobbies: all
        SignificantHobbiesCoreTests: [test]
        SignificantHobbiesTests: [test]
        SignificantHobbiesUITests: [test]
    test:
      targets:
        - SignificantHobbiesCoreTests
        - SignificantHobbiesTests
        - SignificantHobbiesUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
