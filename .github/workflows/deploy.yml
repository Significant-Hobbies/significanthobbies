name: Deploy to Cloudflare Workers
# Rollback: `wrangler versions rollback` from the repo root, or via
# dash.cloudflare.com → Workers → significanthobbies → Versions → "Rollback".
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          if node -e "const pm=require('./package.json').packageManager||''; process.exit(pm.startsWith('pnpm@')?0:1)"; then
            corepack install
          else
            corepack prepare pnpm@10.33.2 --activate
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Build the deploy artifact without populateCache. The package-level
      # cf:build command also warms a local cache through Wrangler, which needs
      # Cloudflare credentials and is not required to produce .open-next/.
      - run: node scripts/cf-build.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
      - name: Purge edge cache
        # Purges the whole zone, not just `/`.
        #
        # worker.mjs edge-caches every path in its CACHEABLE_EXACT set and under
        # its CACHEABLE_PREFIXES (/hobbies, /blog, /bucket-lists, /tools) with
        # s-maxage=86400. Purging only `/` left all of those serving pre-deploy
        # HTML for up to a day — a real deploy shipped a new /hobbies and
        # production kept showing the old one, with the wrong hobby count and
        # none of the new UI. The smoke check below only asserts on `/`, so
        # nothing caught it.
        #
        # Best-effort: a missing zone cache_purge permission (401) must not fail
        # a good deploy.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_id=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=significanthobbies.com" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.result?.[0]?.id||'')})")
          if [ -z "$zone_id" ]; then
            echo "WARN: could not resolve zone id — skipping purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Purged the whole zone for significanthobbies.com"
      - name: Smoke check production
        run: |
          html=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 \
            -H "Cache-Control: no-cache" https://significanthobbies.com/)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "ERROR: failed to fetch homepage"
            exit 1
          fi
          sections=$(printf '%s' "$html" | grep -o '<section' | wc -l | tr -d ' ')
          if ! printf '%s' "$html" | grep -q 'location.replace('\''/dashboard'\'')'; then
            echo "ERROR: stale overlay — expected /dashboard auth redirect in Astro HTML"
            exit 1
          fi
          if [ "$sections" -lt 5 ]; then
            echo "ERROR: stale overlay — expected full Astro landing (>=5 sections), got ${sections}"
            exit 1
          fi
          if ! printf '%s' "$html" | grep -q 'id="lcp-shell"'; then
            echo "ERROR: missing LCP shell in overlaid index.html"
            exit 1
          fi
          echo "Overlay OK: ${sections} sections, LCP shell present"
      - name: Smoke check a cached marketing page
        # `/` is served by the Astro overlay and skips the Worker entirely, so
        # asserting on it proves nothing about the edge-cached HTML paths. This
        # checks one path that goes through worker.mjs's cache, which is where a
        # stale-after-deploy failure actually shows up.
        run: |
          html=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 \
            -H "Cache-Control: no-cache" https://significanthobbies.com/hobbies)
          if ! printf '%s' "$html" | grep -q 'Browse by what suits you'; then
            echo "ERROR: /hobbies is missing the facet browser — likely serving pre-deploy cached HTML."
            echo "Purge the zone and re-check; see docs/operations/runbook.md."
            exit 1
          fi
          echo "/hobbies OK: facet browser present, cache is post-deploy"
