name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/hub-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/hub-backend/package-lock.json
      - run: npm ci
      - run: npm run check

  sync-kit:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: swift test
